name: Conexus Credit Union
kind: company
description: >-
  Conexus Credit Union is Saskatchewan's largest credit union, a member-owned
  cooperative financial institution headquartered in Regina with over $10 billion
  in consolidated assets under management, more than 140,000 members, roughly 30
  branches, and over 800 employees across the province. As a provincially
  regulated Saskatchewan credit union it operates under a cooperative charter,
  with member deposits guaranteed by the Credit Union Deposit Guarantee
  Corporation (CUDGC). In November 2024 Conexus announced its intent to explore a
  merger with Cornerstone and Synergy credit unions. Conexus does not publish a
  first-party public developer API or a developer portal; developer.conexus.ca does
  not resolve, and /developer and /api on the corporate site return 404. Consumer
  financial-data access is provided through third-party aggregators (notably Plaid
  in Canada) via screen-scraping and connection-based data sharing rather than a
  first-party API. Digital and online banking are delivered through core-banking
  and fintech partners (banking.online.conexus.ca), and investing runs through the
  credit-union system's Aviso Wealth / Qtrade and Thrive Wealth partners. Canada's
  federal Consumer-Driven Banking (open banking) framework, overseen by the
  Financial Consumer Agency of Canada (FCAC), is legislated but not yet operational,
  so Conexus's open-finance access remains voluntary and aggregator-mediated today.
