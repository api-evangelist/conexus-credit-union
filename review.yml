actions:
  apisYmlUpdated: true
  reason: |
    Identity-only bootstrap. No public first-party API, no developer portal,
    no downloadable spec. apis[] left empty (honest). Common properties point
    only to verified live pages (Website, Online Banking, LinkedIn, Member
    News, Support, Legal, Privacy, Security). Open-finance posture recorded
    as aggregator-only pending Canada's not-yet-operational Consumer-Driven
    Banking framework.
